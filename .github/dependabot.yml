version: 2
updates:
  # Python test / dev toolchain (requirements-test.txt + pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    # Bundle minor + patch bumps into one PR; majors stay separate for review.
    groups:
      python-dependencies:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    # Bundle minor + patch bumps into one PR; majors stay separate for review.
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
