name: 'Close stale issues and PRs'

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-message: >-
            This issue is stale because it has been open 60 days with no
            activity. Remove the stale label or comment or this will be closed
            in 7 days.
          stale-pr-message: >-
            This pull request is stale because it has been open 60 days with no
            activity. Remove the stale label or comment or this will be closed
            in 7 days.
          exempt-issue-labels: 'help wanted,security,pinned'
          exempt-pr-labels: 'help wanted,security,pinned'
          remove-stale-when-updated: true
