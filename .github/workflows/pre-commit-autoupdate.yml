name: pre-commit autoupdate

# Dependabot has no "pre-commit" ecosystem, so it cannot bump the hook revisions
# in .pre-commit-config.yaml. This workflow fills that gap: it runs
# `pre-commit autoupdate` weekly and opens a pull request with the result.
#
# Requires: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests" must be enabled.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC, aligned with Dependabot
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  autoupdate:
    name: Update pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit autoupdate
        run: pre-commit autoupdate

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "build: pre-commit autoupdate"
          branch: chore/pre-commit-autoupdate
          delete-branch: true
          title: "build: pre-commit autoupdate"
          body: |
            Weekly automated `pre-commit autoupdate` — bumps the hook revisions in
            `.pre-commit-config.yaml` to their latest released tags.

            Dependabot does not cover the pre-commit ecosystem, so this workflow
            fills that gap.
          labels: dependencies
