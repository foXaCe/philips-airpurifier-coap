name: Publish Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

# The manifest version is already set by the `release: vX.Y.Z` commit. This
# workflow creates the GitHub release for the pushed tag (draft, then published)
# or, if a draft already exists for the tag, flips it to published. The body is
# the matching section from CHANGELOG.md (Keep a Changelog).
concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Create or publish the release for this tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME;
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");

            // Extract the body for this tag from the Keep-a-Changelog file:
            // everything between "## [<tag>] - <date>" and the next "## ".
            const version = tag.replace(/^v/, "");
            const re = new RegExp(
              `## \\[${version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\] - .*\\n([\\s\\S]*?)(?=\\n## |\\z)`,
            );
            const match = changelog.match(re);
            const body = match ? match[1].trim() : "No changelog entry found.";

            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const draft = releases.find(
              (release) => release.draft && release.tag_name === tag,
            );

            if (draft) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draft.id,
                name: tag,
                body,
                draft: false,
              });
              core.info(`Published existing draft release ${tag}.`);
              return;
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body,
            });
            core.info(`Created release ${tag}.`);
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
