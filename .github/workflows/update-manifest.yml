name: Publish Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

# The manifest version is already set by the `release: vX.Y.Z` commit, so this
# workflow only flips the matching draft release to published. It does not check
# out, rewrite the manifest or re-tag, which previously raced the HACS/hassfest
# runs triggered by the same tag push.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish the draft release for this tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const draft = releases.find(
              (release) => release.draft && release.tag_name === tag
            );
            if (!draft) {
              core.info(`No draft release for ${tag}; nothing to publish.`);
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: draft.id,
              draft: false,
            });
            core.info(`Published release ${tag}.`);
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
