name: Validate with hassfest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      # Use the fork that tolerates the bundled custom `pap:` icon set: the
      # official hassfest rejects any icon in icons.json that is not an `mdi:`
      # Material Design Icon, which would fail this integration's custom icons.
      - uses: kongo09/actions/hassfest@master
