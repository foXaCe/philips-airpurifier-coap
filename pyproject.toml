[project]
name = "philips-airpurifier-coap"
version = "0.40.4"
description = "Home Assistant custom integration for Philips Air Purifiers using CoAP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "kongo09"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "aioairctrl==0.3.1",
    "getmac==0.9.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # aioairctrl's aiocoap monkeypatch imports the deprecated EXCHANGE_LIFETIME
    # constant; upstream issue, not fixable from this integration.
    "ignore:EXCHANGE_LIFETIME is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["custom_components/philips_airpurifier_coap"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
partial_branches = ["pragma: no branch"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C90",    # mccabe complexity
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E203",   # whitespace before ':' (black compatibility)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["homeassistant", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101", "B110"]  # B101: assert in tests, B110: try/except/pass (intentional)

[tool.mypy]
# Matches the HA version type-checked against (recent HA core uses 3.14-only
# syntax); runtime support floor is requires-python / ruff target-version.
python_version = "3.14"
strict = true
# Consume Home Assistant's public API without fighting its re-export hygiene,
# and tolerate untyped third-party deps (aioairctrl, aiocoap, getmac).
ignore_missing_imports = true
implicit_reexport = true
